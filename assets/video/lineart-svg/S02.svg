<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 225"><defs>
<marker id="redArrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#ff6b6b"/></marker>
<marker id="blueArrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#4da3ff"/></marker>
</defs>
    <!-- 堂内背景 -->
    <g stroke="#c9c9c9" stroke-width="1.5" fill="none">
      <rect x="15" y="15" width="370" height="180" rx="4"/>
      <path d="M60,15 L60,195"/>
      <path d="M340,15 L340,195"/>
    </g>
    <!-- 高太公（左，拱手） -->
    <g stroke="#3a3a3a" stroke-width="2.5" fill="none" stroke-linecap="round">
      <circle cx="160" cy="75" r="14"/>              <!-- 头 -->
      <path d="M146,85 l-6,8"/>                       <!-- 帽翅 -->
      <path d="M160,89 L160,150"/>                    <!-- 身 -->
      <path d="M160,100 Q135,112 128,125"/>          <!-- 拱手左臂 -->
      <path d="M160,100 Q185,112 192,125"/>          <!-- 拱手右臂 -->
      <path d="M160,150 Q150,180 148,195"/>          <!-- 腿 -->
      <path d="M160,150 Q170,180 172,195"/>
    </g>
    <!-- 动作：拱手作揖（红） -->
    <path d="M128,128 Q110,138 108,150 Q106,160 115,158" stroke="#ff6b6b" stroke-width="2" fill="none" stroke-dasharray="5,4" marker-end="url(#redArrow)"/>
    <!-- 高才（右，侍立） -->
    <g stroke="#5a5a5a" stroke-width="2.2" fill="none" stroke-linecap="round">
      <circle cx="270" cy="90" r="10"/>
      <path d="M270,100 L270,150"/>
      <path d="M270,108 L258,130"/>
      <path d="M270,108 L282,130"/>
      <path d="M270,150 L264,195"/>
      <path d="M270,150 L276,195"/>
    </g>
    <text x="160" y="75" font-size="9" fill="#777" text-anchor="middle">高太公</text>
    <text x="270" y="90" font-size="9" fill="#999" text-anchor="middle">高才</text>
    <!-- 微摇（蓝） -->
    <path d="M230,205 Q200,210 230,215 Q260,220 230,225" stroke="#4da3ff" stroke-width="1.5" fill="none"/>
    <text x="215" y="218" font-size="10" fill="#4da3ff">微摇</text>
  </svg>