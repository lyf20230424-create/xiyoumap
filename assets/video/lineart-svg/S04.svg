<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 225"><defs>
<marker id="redArrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#ff6b6b"/></marker>
<marker id="blueArrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#4da3ff"/></marker>
</defs>
    <!-- 闺房背景 -->
    <g stroke="#c9c9c9" stroke-width="1.5" fill="none">
      <path d="M100,20 Q110,110 105,200" stroke-dasharray="4,3"/>
      <path d="M300,20 Q290,110 295,200" stroke-dasharray="4,3"/>
      <line x1="105" y1="200" x2="295" y2="200"/>
      <rect x="40" y="150" width="320" height="45" rx="5"/>
    </g>
    <!-- 悟空变翠兰（坐床，盖头） -->
    <g stroke="#3a3a3a" stroke-width="2.6" fill="none" stroke-linecap="round">
      <path d="M185,90 Q200,70 215,90 L215,170 Q200,180 185,170 Z"/>  <!-- 身 -->
      <!-- 盖头 -->
      <path d="M180,82 Q200,58 220,82 Q228,95 220,104 Q200,92 180,104 Z"/>
      <!-- 盖头下的猴脸（半露） -->
      <circle cx="200" cy="98" r="12"/>
      <path d="M190,100 q2,-3 4,0"/>                   <!-- 猴嘴 -->
      <circle cx="195" cy="94" r="2" fill="#3a3a3a" stroke="none"/>
      <circle cx="205" cy="94" r="2" fill="#3a3a3a" stroke="none"/>
    </g>
    <!-- 动作：掀盖头露猴脸（红） -->
    <path d="M160,80 Q150,66 138,70" stroke="#ff6b6b" stroke-width="2.5" fill="none" stroke-dasharray="6,4" marker-end="url(#redArrow)"/>
    <text x="140" y="62" font-size="11" fill="#ff6b6b">掀盖头</text>
    <!-- 近景对焦框（虚线框） -->
    <rect x="160" y="55" width="80" height="70" fill="none" stroke="#ff6b6b" stroke-width="1.8" stroke-dasharray="4,3"/>
    <!-- 推近运镜（蓝） -->
    <path d="M200,222 L200,130" stroke="#4da3ff" stroke-width="2.5" fill="none" stroke-dasharray="7,5" marker-end="url(#blueArrow)"/>
    <text x="208" y="175" font-size="10" fill="#4da3ff">推近盖头</text>
  </svg>